<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Pump House</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- go straight to the Dashboard (it sends you to Login if you are not logged in) -->
  <script>location.replace("dashboard.html" + location.search + location.hash);</script>
  <noscript><meta http-equiv="refresh" content="0; url=dashboard.html"></noscript>
  <style>
    html,body{margin:0;height:100%;background:#F3F4F1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme:dark){html,body{background:#0F1418}}
    .boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#5A6672;font-size:14px}
    .boot i{width:56px;height:56px;border-radius:16px;background:#0E6A8C;display:flex;align-items:center;justify-content:center}
    .boot i::after{content:"";width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot"><i></i><span>Opening…</span></div>
</body>
</html>
